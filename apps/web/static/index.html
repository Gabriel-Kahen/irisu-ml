<!doctype html>
<html lang="en" data-ready="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070a0b">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com; worker-src 'self' blob:; frame-src 'self' https://open.spotify.com; style-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' https://*.google-analytics.com https://www.googletagmanager.com">
  <title>irisu</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DCS6EVRYKH"></script>
  <script src="./analytics.js"></script>
  <link rel="stylesheet" href="./styles.css?v=20261006f">
  <link rel="preload" href="./exact-runtime/v86.wasm?v=20260824k" as="fetch" type="application/wasm" crossorigin>
  <link rel="preload" href="./exact-runtime/buildroot-bzimage68.bin?v=20260824k" as="fetch" crossorigin>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">irisu</div>
      <div class="header-actions">
        <button id="openReplayButton" type="button" disabled>play replay</button>
        <input id="replayFileInput" type="file" accept=".rpy,application/octet-stream" hidden>
        <button id="pauseButton">pause <kbd>enter</kbd></button>
        <button id="restartButton">restart <kbd>R</kbd></button>
        <a class="github-link" href="https://github.com/Gabriel-Kahen/irisu-ml" target="_blank" rel="noopener noreferrer" aria-label="View project on GitHub" title="View project on GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M12 .75a11.25 11.25 0 0 0-3.558 21.924c.563.104.768-.244.768-.542 0-.267-.01-.975-.015-1.914-3.13.68-3.79-1.508-3.79-1.508-.512-1.3-1.25-1.646-1.25-1.646-1.023-.7.078-.686.078-.686 1.132.08 1.728 1.162 1.728 1.162 1.006 1.724 2.64 1.226 3.283.938.102-.729.394-1.226.716-1.508-2.498-.284-5.124-1.25-5.124-5.565 0-1.23.44-2.234 1.16-3.022-.116-.284-.503-1.429.11-2.978 0 0 .945-.303 3.094 1.154A10.79 10.79 0 0 1 12 6.18c.956.005 1.918.13 2.818.379 2.148-1.457 3.09-1.154 3.09-1.154.616 1.549.229 2.694.113 2.978.722.788 1.158 1.792 1.158 3.022 0 4.326-2.63 5.278-5.136 5.557.404.35.766 1.042.766 2.1 0 1.516-.014 2.738-.014 3.11 0 .3.202.65.774.54A11.251 11.251 0 0 0 12 .75Z"/>
          </svg>
        </a>
      </div>
    </header>

    <div class="layout">
      <section class="game-frame">
        <canvas id="game" width="640" height="480" tabindex="0" aria-label="Irisu game field"></canvas>
        <div id="runtimeLoading" class="runtime-loading" role="status" aria-live="polite" aria-atomic="true">
          <div class="runtime-spinner" aria-hidden="true"></div>
          <strong>loading</strong>
        </div>
        <div id="gameOver" class="modal" hidden>
          <span class="modal-kicker">RUN COMPLETE</span>
          <h1 id="finalTitle">Game over</h1>
          <p id="finalScore">00000000</p>
          <div class="modal-actions">
            <button id="saveReplayButton" type="button">save replay (.rpy)</button>
            <button id="againButton" type="button" class="primary">try again</button>
          </div>
        </div>
        <div id="paused" class="pause-mark" hidden>PAUSED</div>
      </section>

      <section id="replayControls" class="replay-controls" aria-label="Replay playback controls" hidden>
        <div class="replay-meta">
          <strong id="replayName">Replay</strong>
          <span id="replayStatus"></span>
          <span id="replayAnnouncement" class="visually-hidden" role="status" aria-live="polite"></span>
        </div>
        <div class="replay-transport">
          <button id="replayPlayButton" type="button">pause</button>
          <button id="replayBackButton" type="button" aria-label="Jump back 5 seconds">−5s <kbd>←</kbd></button>
          <button id="replayForwardButton" type="button" aria-label="Jump forward 5 seconds">+5s <kbd>→</kbd></button>
          <label class="replay-speed" for="replaySpeed">speed
            <select id="replaySpeed">
              <option value="1">1x</option>
              <option value="2">2x</option>
              <option value="4">4x</option>
              <option value="8">8x</option>
            </select>
          </label>
          <label class="visually-hidden" for="replayScrubber">Replay position</label>
          <input id="replayScrubber" class="replay-scrubber" type="range" min="0" max="0" value="0" step="1">
          <output id="replayPosition" for="replayScrubber">frame 0 / 0</output>
          <button id="exitReplayButton" type="button">new game</button>
        </div>
        <div id="replayError" class="replay-error" role="alert" hidden></div>
      </section>

    </div>
    <section class="soundtrack" aria-label="Game music">
      <iframe id="spotifyPlayer" title="Spotify soundtrack player"
        src="./spotify-player.html?v=20261006e"
        width="100%" height="80" allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>
      <p id="musicStatus" role="status" hidden></p>
    </section>
    <div id="appError" class="app-error" role="alert" hidden></div>
  </main>
  <div id="toast" class="toast"></div>
  <script type="module" src="./app.js?v=20261006e"></script>
</body>
</html>
